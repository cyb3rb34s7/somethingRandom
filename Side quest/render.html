<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Schedule Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0f0f13;
  --surface: #17171e;
  --surface2: #1e1e28;
  --surface3: #26263300;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f0f5;
  --text2: #9090a8;
  --text3: #5a5a70;
  --accent: #6c63ff;
  --accent2: #8b84ff;

  --ch0: #6c63ff; --ch0bg: rgba(108,99,255,0.15);
  --ch1: #ff6b6b; --ch1bg: rgba(255,107,107,0.15);
  --ch2: #4ecdc4; --ch2bg: rgba(78,205,196,0.15);
  --ch3: #ffd166; --ch3bg: rgba(255,209,102,0.15);
  --ch4: #a8e6cf; --ch4bg: rgba(168,230,207,0.15);
  --ch5: #ff9ff3; --ch5bg: rgba(255,159,243,0.15);
  --ch6: #54a0ff; --ch6bg: rgba(84,160,255,0.15);
  --ch7: #ff9f43; --ch7bg: rgba(255,159,67,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Header ── */
.app-header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 28px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 100;
}

.app-header h1 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--text);
}

.header-sep { width: 1px; height: 20px; background: var(--border2); }

.nav-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border-radius: 7px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.nav-btn:hover { background: var(--surface2); color: var(--text); }
.nav-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.nav-arrow {
  width: 30px; height: 30px;
  border-radius: 7px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.15s;
}
.nav-arrow:hover { background: var(--surface2); color: var(--text); }

.period-label {
  font-size: 14px;
  font-weight: 500;
  min-width: 160px;
  text-align: center;
  color: var(--text);
}

.ml-auto { margin-left: auto; }

.breadcrumb {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text2);
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 7px;
  transition: background 0.15s;
}
.breadcrumb:hover { background: var(--surface2); color: var(--text); }
.breadcrumb svg { width: 14px; height: 14px; }

/* ── Channel legend ── */
.legend-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 28px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  background: var(--surface);
}
.legend-chip {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
  opacity: 1;
}
.legend-chip.muted { opacity: 0.35; }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; }

/* ── Grid View ── */
.grid-view { padding: 20px 28px; }

.week-header-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 6px;
}
.week-day-label {
  text-align: center;
  font-size: 11px;
  font-weight: 500;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 4px 0;
}

.week-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.day-cell {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  min-height: 140px;
  padding: 8px;
  cursor: pointer;
  transition: all 0.18s;
  position: relative;
  overflow: hidden;
}
.day-cell:hover { border-color: var(--border2); background: var(--surface2); transform: translateY(-1px); }
.day-cell.today { border-color: var(--accent); }
.day-cell.other-month { opacity: 0.4; }
.day-cell.month-mode { min-height: 100px; }

.day-num {
  font-size: 12px;
  font-weight: 600;
  font-family: 'DM Mono', monospace;
  color: var(--text2);
  margin-bottom: 6px;
}
.day-cell.today .day-num {
  color: #fff;
  background: var(--accent);
  width: 22px; height: 22px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
}

.ch-strip {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 5px;
  border-radius: 5px;
  margin-bottom: 3px;
  cursor: pointer;
  transition: opacity 0.12s;
}
.ch-strip:hover { opacity: 0.8; }
.ch-strip-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.ch-strip-title {
  font-size: 10.5px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.ch-strip-time {
  font-size: 9.5px;
  font-family: 'DM Mono', monospace;
  color: var(--text3);
  flex-shrink: 0;
}

.more-chip {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px;
  font-weight: 500;
  color: var(--text3);
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 2px 7px;
  border-radius: 20px;
  margin-top: 3px;
  cursor: pointer;
  transition: all 0.12s;
}
.more-chip:hover { color: var(--text2); border-color: var(--border2); }

/* ── Timeline View ── */
.timeline-view { padding: 20px 28px; }

.tl-date-header {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.5px;
  margin-bottom: 16px;
  color: var(--text);
}
.tl-date-header span { color: var(--text3); font-weight: 400; font-size: 14px; margin-left: 8px; }

.tl-wrap {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface);
}

.tl-time-header {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.tl-ch-col {
  width: 110px;
  min-width: 110px;
  flex-shrink: 0;
  padding: 8px 12px;
  font-size: 10px;
  font-weight: 500;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-right: 1px solid var(--border);
}

.tl-hours-row {
  flex: 1;
  display: flex;
  overflow: hidden;
}
.tl-hour-label {
  flex: 1;
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  color: var(--text3);
  padding: 8px 4px;
  border-right: 1px solid var(--border);
  white-space: nowrap;
}
.tl-hour-label:last-child { border-right: none; }

.tl-channel-row {
  display: flex;
  border-bottom: 1px solid var(--border);
  min-height: 52px;
  align-items: stretch;
}
.tl-channel-row:last-child { border-bottom: none; }

.tl-ch-label {
  width: 110px;
  min-width: 110px;
  flex-shrink: 0;
  padding: 8px 12px;
  border-right: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 7px;
}
.tl-ch-label-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tl-ch-label-name { font-size: 12px; font-weight: 500; color: var(--text2); }

.tl-programs-area {
  flex: 1;
  position: relative;
  min-height: 52px;
}
.tl-grid-lines {
  position: absolute; inset: 0;
  display: flex; pointer-events: none;
}
.tl-grid-line {
  flex: 1;
  border-right: 1px solid var(--border);
}
.tl-grid-line:last-child { border-right: none; }

.tl-block {
  position: absolute;
  top: 5px; bottom: 5px;
  border-radius: 6px;
  padding: 4px 8px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 4px;
}
.tl-block:hover { filter: brightness(1.15); transform: translateY(-1px); z-index: 5; }
.tl-block-title {
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tl-block-time {
  font-size: 9.5px;
  font-family: 'DM Mono', monospace;
  opacity: 0.7;
  white-space: nowrap;
}

/* ── Side Panel ── */
.side-panel-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  backdrop-filter: blur(2px);
}
.side-panel-overlay.open { display: block; }

.side-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 360px;
  background: var(--surface);
  border-left: 1px solid var(--border2);
  z-index: 201;
  transform: translateX(100%);
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column;
}
.side-panel.open { transform: translateX(0); }

.sp-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 12px;
}
.sp-close {
  margin-left: auto;
  width: 28px; height: 28px;
  border-radius: 7px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  transition: all 0.12s;
}
.sp-close:hover { background: var(--surface2); color: var(--text); }

.sp-ch-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 500;
}

.sp-title { font-size: 18px; font-weight: 600; margin: 10px 0 4px; letter-spacing: -0.3px; }
.sp-time { font-size: 13px; font-family: 'DM Mono', monospace; color: var(--text2); }

.sp-body { padding: 20px; flex: 1; overflow-y: auto; }
.sp-row { margin-bottom: 16px; }
.sp-label { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.sp-value { font-size: 14px; color: var(--text); }

.sp-input {
  width: 100%;
  padding: 9px 12px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
.sp-input:focus { border-color: var(--accent); }

.sp-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.sp-btn {
  flex: 1; padding: 10px;
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.sp-btn-primary { background: var(--accent); border: none; color: #fff; }
.sp-btn-primary:hover { background: var(--accent2); }
.sp-btn-secondary { background: transparent; border: 1px solid var(--border2); color: var(--text2); }
.sp-btn-secondary:hover { background: var(--surface2); color: var(--text); }

/* ── Popover ── */
.popover {
  position: fixed;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px;
  z-index: 300;
  min-width: 220px;
  max-width: 260px;
  display: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.popover.open { display: block; }
.popover-title { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.popover-item {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 6px; border-radius: 6px;
  cursor: pointer; transition: background 0.1s;
  margin-bottom: 2px;
}
.popover-item:hover { background: rgba(255,255,255,0.05); }
.popover-item-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.popover-item-title { font-size: 12px; flex: 1; }
.popover-item-time { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--text3); }

/* scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
</style>
</head>
<body>

<!-- Header -->
<div class="app-header">
  <h1>⬡ &nbsp;Schedule Navigator</h1>
  <div class="header-sep"></div>
  <button class="nav-btn active" id="btnWeek">Week</button>
  <button class="nav-btn" id="btnMonth">Month</button>
  <div class="header-sep"></div>
  <button class="nav-arrow" id="btnPrev">&#8592;</button>
  <span class="period-label" id="periodLabel"></span>
  <button class="nav-arrow" id="btnNext">&#8594;</button>
  <div class="ml-auto" id="breadcrumbWrap" style="display:none">
    <div class="breadcrumb" id="breadcrumbBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back to calendar
    </div>
  </div>
</div>

<!-- Legend -->
<div class="legend-bar" id="legendBar"></div>

<!-- Main -->
<div id="mainView"></div>

<!-- Popover -->
<div class="popover" id="popover"></div>

<!-- Side Panel -->
<div class="side-panel-overlay" id="overlay"></div>
<div class="side-panel" id="sidePanel">
  <div class="sp-header" id="spHeader"></div>
  <div class="sp-body" id="spBody"></div>
  <div class="sp-footer">
    <button class="sp-btn sp-btn-secondary" id="spCancel">Cancel</button>
    <button class="sp-btn sp-btn-primary">Save changes</button>
  </div>
</div>

<script>
const CHANNELS = [
  { name: 'Sports HD', short: 'SPRT' },
  { name: 'Cinema+',   short: 'CINE' },
  { name: 'News 24',   short: 'NEWS' },

const CH_COLORS = [
  { color: '#6c63ff', bg: 'rgba(108,99,255,0.18)' },
  { color: '#ff6b6b', bg: 'rgba(255,107,107,0.18)' },
  { color: '#4ecdc4', bg: 'rgba(78,205,196,0.18)'  },
  { color: '#ffd166', bg: 'rgba(255,209,102,0.18)' },
  { color: '#a8e6cf', bg: 'rgba(168,230,207,0.18)' },
  { color: '#ff9ff3', bg: 'rgba(255,159,243,0.18)' },
  { color: '#54a0ff', bg: 'rgba(84,160,255,0.18)'  },
  { color: '#ff9f43', bg: 'rgba(255,159,67,0.18)'  },

const PROGRAMS_TEMPLATE = [
  { ch:0, title:'Morning Highlights',   start:6.0,  dur:1.0  },
  { ch:0, title:'Tennis Live',          start:7.0,  dur:2.5  },
  { ch:0, title:'Football Preview',     start:9.5,  dur:1.0  },

  { ch:1, title:'Late Show',            start:22.5, dur:1.5  },
  { ch:2, title:'Morning Brief',        start:6.0,  dur:1.0  },
  { ch:2, title:'World Update',         start:7.5,  dur:1.0  },
  { ch:2, title:'Market Watch',         start:9.0,  dur:0.5  },

  { ch:2, title:'Evening Bulletin',     start:18.0, dur:1.0  },
  { ch:2, title:'Prime News',           start:21.0, dur:1.0  },
  { ch:2, title:'Night Update',         start:23.0, dur:0.75 },
  { ch:3, title:'Morning Cartoons',     start:6.5,  dur:1.5  },
  { ch:3, title:'Story Time',           start:8.5,  dur:1.0  },
  { ch:3, title:'Educational Hour',     start:10.0, dur:1.0  },
  { ch:3, title:'Cartoon Block',        start:13.0, dur:2.0  },
  { ch:3, title:'Adventure Show',       start:15.5, dur:1.5  },
  { ch:3, title:'Family Movie',         start:17.5, dur:2.0  },
  { ch:3, title:'Bedtime Stories',      start:20.0, dur:0.5  },

  { ch:7, title:'Planet Earth Special', start:19.0, dur:2.0  },
  { ch:7, title:'Deep Sea Live',        start:21.5, dur:1.0  },
];

function fmt(h) {
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60);
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

// State
let mode = 'week'; // 'week' | 'month' | 'day'
let today = new Date(2026, 4, 11);
let currentDate = new Date(today);
let selectedDay = null;
let hiddenChannels = new Set();
let popoverTimeout = null;

function getWeekStart(d) {
  const s = new Date(d);
  const day = s.getDay();
  s.setDate(s.getDate() - day);
  return s;
}

function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function getProgramsForDay(date) {
  // slight variation per day for realism
  const seed = date.getDate();
  return PROGRAMS_TEMPLATE.filter((_, i) => {
    if (seed % 3 === 0 && i % 7 === 0) return false;
    if (seed % 5 === 0 && i % 11 === 0) return false;
    return true;
  }).map(p => ({ ...p, _date: date }));
}

// Legend
function renderLegend() {
  const bar = document.getElementById('legendBar');
  bar.innerHTML = CHANNELS.map((ch, i) => {
    const c = CH_COLORS[i];
    const muted = hiddenChannels.has(i) ? ' muted' : '';
    return `<div class="legend-chip${muted}" onclick="toggleChannel(${i})"
      style="background:${c.bg};border-color:${c.color}40;color:${c.color}">
      <div class="legend-dot" style="background:${c.color}"></div>
      ${ch.name}
    </div>`;
  }).join('');
}

function toggleChannel(idx) {
  if (hiddenChannels.has(idx)) hiddenChannels.delete(idx);
  else hiddenChannels.add(idx);
  renderLegend();
  renderMain();
}

// Period label
function updatePeriodLabel() {
  const label = document.getElementById('periodLabel');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fullMonths = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  if (mode === 'day') {
    const d = selectedDay;
    label.textContent = `${fullMonths[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  } else if (mode === 'week') {
    const ws = getWeekStart(currentDate);
    const we = addDays(ws, 6);
    label.textContent = `${months[ws.getMonth()]} ${ws.getDate()} – ${ws.getMonth() !== we.getMonth() ? months[we.getMonth()]+' ' : ''}${we.getDate()}, ${we.getFullYear()}`;
  } else {
    label.textContent = `${fullMonths[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
  }
}

// Main render dispatch
function renderMain() {
  updatePeriodLabel();
  document.getElementById('breadcrumbWrap').style.display = mode === 'day' ? '' : 'none';
  const v = document.getElementById('mainView');
  if (mode === 'day') renderDayTimeline(v);
  else renderGridView(v);
}

// Grid view
function renderGridView(container) {
  let days = [];
  let html = `<div class="grid-view">`;

  if (mode === 'week') {
    const ws = getWeekStart(currentDate);
    days = Array.from({length:7}, (_,i) => addDays(ws, i));
    html += `<div class="week-header-row">`;
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
      html += `<div class="week-day-label">${d}</div>`;
    });
    html += `</div><div class="week-grid" id="dayGrid">`;
  } else {
    // month
    const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
    const lastDay  = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 0);
    const startPad = firstDay.getDay();
    const endPad   = 6 - lastDay.getDay();
    for (let i = startPad; i > 0; i--) days.push(addDays(firstDay, -i));
    for (let i = 1; i <= lastDay.getDate(); i++) days.push(new Date(currentDate.getFullYear(), currentDate.getMonth(), i));
    for (let i = 1; i <= endPad; i++) days.push(addDays(lastDay, i));

    html += `<div class="week-header-row">`;
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => html += `<div class="week-day-label">${d}</div>`);
    html += `</div><div class="month-grid" id="dayGrid">`;
  }

  days.forEach(day => {
    const isToday = sameDay(day, today);
    const isOther = mode === 'month' && day.getMonth() !== currentDate.getMonth();
    const progs = getProgramsForDay(day).filter(p => !hiddenChannels.has(p.ch));
    const dayStr = day.toDateString();

    let cellClass = 'day-cell';
    if (isToday) cellClass += ' today';
    if (isOther) cellClass += ' other-month';
    if (mode === 'month') cellClass += ' month-mode';

    html += `<div class="${cellClass}" onclick="drillDown('${dayStr}')">`;

    // Day number
    html += `<div class="day-num">${day.getDate()}</div>`;

    // Group by channel, show top program per channel
    const byChannel = {};
    progs.forEach(p => {
      if (!byChannel[p.ch]) byChannel[p.ch] = [];
      byChannel[p.ch].push(p);
    });

    const MAX_STRIPS = mode === 'month' ? 3 : 5;
    let shownCount = 0;
    let moreProgs = [];

    const sortedChs = Object.keys(byChannel).map(Number).sort((a,b) => a-b);
    sortedChs.forEach(chIdx => {
      const chProgs = byChannel[chIdx].sort((a,b) => a.start - b.start);
      chProgs.forEach((p, i) => {
        if (shownCount < MAX_STRIPS) {
          const c = CH_COLORS[p.ch];
          html += `<div class="ch-strip" style="background:${c.bg}" onclick="event.stopPropagation();openPanel(${JSON.stringify(JSON.stringify(p))})">
            <div class="ch-strip-dot" style="background:${c.color}"></div>
            <span class="ch-strip-title" style="color:${c.color}">${p.title}</span>
            <span class="ch-strip-time">${fmt(p.start)}</span>
          </div>`;
          shownCount++;
        } else {
          moreProgs.push(p);
        }
      });
    });

    if (moreProgs.length > 0) {
      html += `<div class="more-chip" onclick="event.stopPropagation();showMore(event,'${dayStr}')">+${moreProgs.length} more</div>`;
    }

    html += `</div>`;
  });

  html += `</div></div>`;
  container.innerHTML = html;

  // store moreProgs per day
  window._dayProgs = {};
  days.forEach(day => {
    const dayStr = day.toDateString();
    const progs = getProgramsForDay(day).filter(p => !hiddenChannels.has(p.ch));
    window._dayProgs[dayStr] = progs;
  });
}

function showMore(event, dayStr) {
  event.stopPropagation();
  const all = window._dayProgs[dayStr] || [];
  const MAX = mode === 'month' ? 3 : 5;
  const more = all.slice(MAX);

  const pop = document.getElementById('popover');
  pop.innerHTML = `<div class="popover-title">${dayStr} — ${more.length} more programs</div>`;
  more.forEach(p => {
    const c = CH_COLORS[p.ch];
    pop.innerHTML += `<div class="popover-item" onclick="openPanel(${JSON.stringify(JSON.stringify(p))})">
      <div class="popover-item-dot" style="background:${c.color}"></div>
      <span class="popover-item-title">${p.title}</span>
      <span class="popover-item-time">${fmt(p.start)}</span>
    </div>`;
  });
  pop.innerHTML += `<div style="border-top:1px solid rgba(255,255,255,0.07);margin-top:6px;padding-top:6px">
    <div class="popover-item" onclick="drillDown('${dayStr}')">
      <span style="font-size:12px;color:#6c63ff">↗ View full day timeline</span>
    </div>
  </div>`;

  const rect = event.target.getBoundingClientRect();
  pop.style.top = (rect.bottom + 8) + 'px';
  pop.style.left = rect.left + 'px';
  pop.classList.add('open');
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.popover') && !e.target.closest('.more-chip')) {
    document.getElementById('popover').classList.remove('open');
  }
});

// Day drilldown
function drillDown(dayStr) {
  selectedDay = new Date(dayStr);
  mode = 'day';
  document.getElementById('popover').classList.remove('open');
  renderMain();
}

function renderDayTimeline(container) {
  const START = 6, END = 24, TOTAL = END - START;
  const hours = Array.from({length: TOTAL}, (_,i) => START + i);
  const progs = getProgramsForDay(selectedDay).filter(p => !hiddenChannels.has(p.ch));

  let html = `<div class="timeline-view">
    <div class="tl-date-header">
      ${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][selectedDay.getDay()]}, 
      ${['January','February','March','April','May','June','July','August','September','October','November','December'][selectedDay.getMonth()]}
      ${selectedDay.getDate()}
      <span>${progs.length} programs across ${CHANNELS.length} channels</span>
    </div>
    <div class="tl-wrap">
      <div class="tl-time-header">
        <div class="tl-ch-col">Channel</div>
        <div class="tl-hours-row">`;

  hours.forEach(h => {
    html += `<div class="tl-hour-label">${String(h).padStart(2,'0')}:00</div>`;
  });
  html += `</div></div>`;

  CHANNELS.forEach((ch, ci) => {
    if (hiddenChannels.has(ci)) return;
    const c = CH_COLORS[ci];
    const chProgs = progs.filter(p => p.ch === ci);
    html += `<div class="tl-channel-row">
      <div class="tl-ch-label">
        <div class="tl-ch-label-dot" style="background:${c.color}"></div>
        <div class="tl-ch-label-name">${ch.name}</div>
      </div>
      <div class="tl-programs-area">
        <div class="tl-grid-lines">`;
    hours.forEach(() => html += `<div class="tl-grid-line"></div>`);
    html += `</div>`;

    chProgs.forEach(p => {
      const left = ((p.start - START) / TOTAL) * 100;
      const width = (p.dur / TOTAL) * 100;
      const minW = Math.max(width, 1.5);
      html += `<div class="tl-block"
        style="left:${left}%;width:calc(${minW}% - 3px);background:${c.bg};border-left:3px solid ${c.color}"
        onclick="openPanel(${JSON.stringify(JSON.stringify(p))})">
        <div class="tl-block-title" style="color:${c.color}">${p.title}</div>
        <div class="tl-block-time">${fmt(p.start)}–${fmt(p.start+p.dur)}</div>
      </div>`;
    });

    html += `</div></div>`;
  });

  html += `</div></div>`;
  container.innerHTML = html;
}

// Side panel
function openPanel(pJson) {
  const p = JSON.parse(pJson);
  const c = CH_COLORS[p.ch];
  const ch = CHANNELS[p.ch];
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sidePanel').classList.add('open');

  document.getElementById('spHeader').innerHTML = `
    <div style="flex:1">
      <div class="sp-ch-badge" style="background:${c.bg};color:${c.color};border:1px solid ${c.color}40">
        <div style="width:6px;height:6px;border-radius:50%;background:${c.color}"></div>
        ${ch.name}
      </div>
      <div class="sp-title">${p.title}</div>
      <div class="sp-time">${fmt(p.start)} – ${fmt(p.start + p.dur)} &nbsp;·&nbsp; ${p.dur >= 1 ? p.dur + 'h' : Math.round(p.dur*60)+'m'}</div>
    </div>
    <button class="sp-close" onclick="closePanel()">✕</button>`;

  document.getElementById('spBody').innerHTML = `
    <div class="sp-row">
      <div class="sp-label">Title</div>
      <input class="sp-input" value="${p.title}"/>
    </div>
    <div class="sp-row">
      <div class="sp-label">Channel</div>
      <div class="sp-value">${ch.name}</div>
    </div>
    <div class="sp-row">
      <div class="sp-label">Start time</div>
      <input class="sp-input" value="${fmt(p.start)}"/>
    </div>
    <div class="sp-row">
      <div class="sp-label">End time</div>
      <input class="sp-input" value="${fmt(p.start + p.dur)}"/>
    </div>
    <div class="sp-row">
      <div class="sp-label">Duration</div>
      <div class="sp-value">${p.dur >= 1 ? p.dur + ' hours' : Math.round(p.dur*60)+' minutes'}</div>
    </div>
    <div class="sp-row">
      <div class="sp-label">Notes</div>
      <textarea class="sp-input" rows="3" style="resize:vertical" placeholder="Add notes..."></textarea>
    </div>`;
}

function closePanel() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sidePanel').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', closePanel);
document.getElementById('spCancel').addEventListener('click', closePanel);

// Nav
document.getElementById('btnWeek').addEventListener('click', () => {
  mode = 'week';
  document.getElementById('btnWeek').classList.add('active');
  document.getElementById('btnMonth').classList.remove('active');
  renderMain();
});
document.getElementById('btnMonth').addEventListener('click', () => {
  mode = 'month';
  document.getElementById('btnMonth').classList.add('active');
  document.getElementById('btnWeek').classList.remove('active');
  renderMain();
});
document.getElementById('btnPrev').addEventListener('click', () => {
  if (mode === 'week') currentDate = addDays(currentDate, -7);
  else if (mode === 'month') { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()-1, 1); }
  else { selectedDay = addDays(selectedDay, -1); }
  renderMain();
});
document.getElementById('btnNext').addEventListener('click', () => {
  if (mode === 'week') currentDate = addDays(currentDate, 7);
  else if (mode === 'month') { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 1); }
  else { selectedDay = addDays(selectedDay, 1); }
  renderMain();
});
document.getElementById('breadcrumbBtn').addEventListener('click', () => {
  mode = 'week';
  document.getElementById('btnWeek').classList.add('active');
  document.getElementById('btnMonth').classList.remove('active');
  renderMain();
});

// Init
renderLegend();
renderMain();
</script>
</body>
</html>
