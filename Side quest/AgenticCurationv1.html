<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Curation Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#0b0b0b;
    --surface:#171717;
    --surface-2:#1f1f1f;
    --text:#ffffff;
    --muted:#9e9e9e;
    --accent:#00d68f;
}

body{
    background:var(--bg);
    color:white;
    font-family:'Segoe UI',sans-serif;
    overflow:auto;
}

/* ---------- HEADER ---------- */

.header{
    padding:28px 60px;
    border-bottom:1px solid #242424;
    background:#111;
    position:sticky;
    top:0;
    z-index:100;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.portal-title{
    font-size:34px;
    font-weight:700;
}

.portal-subtitle{
    margin-top:6px;
    color:var(--muted);
}

.stats{
    display:flex;
    gap:18px;
}

.stat{
    background:var(--surface);
    padding:12px 18px;
    border-radius:10px;
    text-align:center;
}

.stat-value{
    font-size:22px;
    font-weight:700;
}

.stat-label{
    font-size:12px;
    color:var(--muted);
}

/* ---------- AI BANNER ---------- */

.ai-banner{
    margin:30px 60px;
    border-radius:18px;
    overflow:hidden;
    height:280px;

    background:
    linear-gradient(
        90deg,
        rgba(0,0,0,.88),
        rgba(0,0,0,.45)
    ),
    url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1800");

    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
}

.ai-content{
    max-width:650px;
    padding:40px;
}

.ai-tag{
    display:inline-block;
    background:#00d68f;
    color:black;
    font-weight:700;
    padding:6px 12px;
    border-radius:999px;
    margin-bottom:16px;
}

.ai-title{
    font-size:40px;
    margin-bottom:12px;
}

.ai-desc{
    color:#d0d0d0;
    line-height:1.6;
}

/* ---------- ROW ---------- */

.row{
    margin-bottom:40px;
}

.row-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 60px 16px;
}

.row-title{
    font-size:28px;
    font-weight:600;
}

.row-count{
    color:var(--muted);
}

.cards{
    display:flex;
    gap:20px;
    overflow-x:auto;
    padding:25px 60px 40px;
    scroll-behavior:smooth;
    scrollbar-width:none;
}

.cards::-webkit-scrollbar{
    display:none;
}

/* ---------- CARD ---------- */

.card{
    width:320px;
    flex:0 0 auto;

    background:var(--surface);

    border-radius:14px;

    overflow:hidden;

    border:2px solid transparent;

    transition:.2s ease;

    position:relative;

    z-index:1;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    display:block;
}

.card-body{
    padding:14px;
}

.title{
    font-size:17px;
    font-weight:600;
    margin-bottom:6px;
}

.umd{
    color:var(--muted);
    font-size:13px;
}

.meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
}

.badge{
    background:#18342b;
    color:#7effc7;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
}

.genre{
    color:#bfbfbf;
    font-size:12px;
}

.card.focused{
    transform:translateY(-8px) scale(1.04);

    border:2px solid white;

    box-shadow:
    0 0 0 2px rgba(255,255,255,.15),
    0 10px 35px rgba(255,255,255,.15);

    z-index:999;
}

/* ---------- FOOTER ---------- */

.footer-space{
    height:40px;
}

</style>
</head>
<body>

<header class="header">

    <div class="header-top">

        <div>
            <div class="portal-title">
                Agentic Curation Portal
            </div>

            <div class="portal-subtitle">
                AI-assisted TV Content Curation
            </div>
        </div>

        <div class="stats">

            <div class="stat">
                <div class="stat-value">4</div>
                <div class="stat-label">ROWS</div>
            </div>

            <div class="stat">
                <div class="stat-value">20</div>
                <div class="stat-label">TITLES</div>
            </div>

            <div class="stat">
                <div class="stat-value">96%</div>
                <div class="stat-label">AI QUALITY</div>
            </div>

        </div>

    </div>

</header>

<section class="ai-banner">

    <div class="ai-content">

        <div class="ai-tag">
            AI RECOMMENDATION
        </div>

        <div class="ai-title">
            Featured Curation Insight
        </div>

        <div class="ai-desc">
            High engagement growth detected for
            Sci-Fi and Action content.
            Recommended placement in Prime-Time
            discovery rails.
        </div>

    </div>

</section>

<script>

const rows = [

{
title:"Trending Movies In India",
items:[
["Jurassic Park","UMD-10001","Adventure",96],
["Kalki 2898 AD","UMD-10002","Sci-Fi",95],
["RRR","UMD-10003","Action",94],
["Pushpa","UMD-10004","Drama",92],
["Pathaan","UMD-10005","Thriller",91]
]
},

{
title:"Trending Shows",
items:[
["Anupama","UMD-20001","Drama",95],
["TMKOC","UMD-20002","Comedy",93],
["Panchayat","UMD-20003","Comedy",94],
["Mirzapur","UMD-20004","Crime",92],
["The Family Man","UMD-20005","Thriller",93]
]
},

{
title:"Most Searched Content",
items:[
["Hanuman Chalisa","UMD-30001","Devotional",98],
["Game Of Thrones","UMD-30002","Fantasy",96],
["Jurassic Park","UMD-30003","Adventure",91],
["Anupama","UMD-30004","Drama",90],
["TMKOC Specials","UMD-30005","Comedy",89]
]
},

{
title:"IMDb Top Rated Indian Movies",
items:[
["3 Idiots","UMD-40001","Comedy",97],
["Dangal","UMD-40002","Drama",96],
["Drishyam","UMD-40003","Thriller",95],
["Sholay","UMD-40004","Classic",94],
["Lagaan","UMD-40005","Drama",93]
]
}

];

const images = [

"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1200",
"https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=1200",
"https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=1200",
"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1200",
"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=1200"

];

const container = document.body;

rows.forEach((row,index)=>{

const rowDiv=document.createElement('div');

rowDiv.className='row';

rowDiv.innerHTML=`
<div class="row-header">
    <div class="row-title">${row.title}</div>
    <div class="row-count">${row.items.length} Titles</div>
</div>

<div class="cards">
${
row.items.map((item,i)=>`
<div class="card">

<img src="${images[i % images.length]}">

<div class="card-body">

<div class="title">${item[0]}</div>

<div class="umd">${item[1]}</div>

<div class="meta">
<div class="genre">${item[2]}</div>
<div class="badge">AI ${item[3]}</div>
</div>

</div>

</div>
`).join('')
}
</div>
`;

container.appendChild(rowDiv);

});

const footer=document.createElement('div');
footer.className='footer-space';
document.body.appendChild(footer);

/* TV Navigation */

const rowsEl=[...document.querySelectorAll('.cards')];

let rowIndex=0;
let colIndex=0;

function focusCard(){

document
.querySelectorAll('.card')
.forEach(c=>c.classList.remove('focused'));

const cards=
rowsEl[rowIndex]
.querySelectorAll('.card');

const card=cards[colIndex];

card.classList.add('focused');

card.scrollIntoView({
behavior:'smooth',
inline:'center',
block:'nearest'
});

}

focusCard();

document.addEventListener('keydown',(e)=>{

const cards=
rowsEl[rowIndex]
.querySelectorAll('.card');

switch(e.key){

case 'ArrowRight':
colIndex=Math.min(
colIndex+1,
cards.length-1
);
break;

case 'ArrowLeft':
colIndex=Math.max(
colIndex-1,
0
);
break;

case 'ArrowDown':

if(rowIndex<rowsEl.length-1){

rowIndex++;

const next=
rowsEl[rowIndex]
.querySelectorAll('.card');

colIndex=Math.min(
colIndex,
next.length-1
);

}
break;

case 'ArrowUp':

if(rowIndex>0){

rowIndex--;

const prev=
rowsEl[rowIndex]
.querySelectorAll('.card');

colIndex=Math.min(
colIndex,
prev.length-1
);

}
break;

default:
return;

}

focusCard();

});

</script>

</body>
</html>
